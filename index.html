<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="失敗から再挑戦までの過程を記録・共有するSNS「TRYLOG」" />
    <title>TRYLOG - 挑戦する人のための記録SNS</title>
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

    <!-- Critical Inline Styles to prevent FOUT / Gray box flashes before font/js load -->
    <style>
      :root {
        --md-sys-color-background: #F9F9FF;
        --app-max-width: 430px;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #F9F9FF;
        font-family: 'Noto Sans JP', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        max-width: 430px;
        margin: 0 auto;
        min-height: 100dvh;
        background: #F9F9FF;
      }
      /* Prevent Material Symbols ligature text from expanding containers before font loads */
      .material-symbols-rounded {
        font-family: 'Material Symbols Rounded', sans-serif;
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        font-feature-settings: 'liga';
        overflow: hidden;
        width: 1em;
        height: 1em;
        max-width: 1em;
        max-height: 1em;
        vertical-align: middle;
        user-select: none;
        box-sizing: content-box;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="page-container"></div>
      <nav id="bottom-nav"></nav>
    </div>
    <div id="toast-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
