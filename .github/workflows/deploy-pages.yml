name: Deploy to GitHub Pages (build + push to gh-pages)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Show Node / npm versions
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          npx -v || true
      - name: Build
        run: npm run build
      - name: List build output (debug)
        run: |
          echo "-- dist contents --"
          ls -la ./dist || true
          echo "-- dist size --"
          du -sh ./dist || true
          echo "-- head of index.html --"
          head -n 40 ./dist/index.html || true
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
